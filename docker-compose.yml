services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-inspections}
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-inspections}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    environment:
      ML_STUB: ${ML_STUB:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:8001/v1}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed-for-vllm}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
    ports: ["8000:8000"]
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/manuals:/app/manuals

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-inspections}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      ML_TIMEOUT_MS: ${ML_TIMEOUT_MS:-30000}
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  db-data:
