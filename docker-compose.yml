services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-inspections}
    ports: ["${POSTGRES_PORT:-5432}:5432"]   # host port; change POSTGRES_PORT in .env if 5432 is taken
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-inspections}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    environment:
      ML_STUB: ${ML_STUB:-1}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-Gemma-4-31B-IT}
    ports: ["${ML_PORT:-8000}:8000"]
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/manuals:/app/manuals

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-inspections}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      ML_TIMEOUT_MS: ${ML_TIMEOUT_MS:-30000}
      ML_EXPLAIN_TIMEOUT_MS: ${ML_EXPLAIN_TIMEOUT_MS:-90000}   # /explain calls the LLM (6-33 s)
      PORT: 3000
      OPENAPI_PATH: /contracts/backend.openapi.yaml   # for the /docs page
      UPLOAD_DIR: /app/uploads                         # images, masks, heatmaps
    ports: ["${BACKEND_PORT:-3000}:3000"]
    volumes:
      - ./contracts:/contracts:ro
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}   # nginx in the frontend container proxies /api
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on: [backend]

volumes:
  db-data:
  uploads:
