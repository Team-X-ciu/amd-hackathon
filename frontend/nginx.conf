# Serves the built SPA and proxies /api to the backend, so the browser talks to one origin
# and the contract's relative URLs (/api/inspections/{id}/mask, ...) resolve.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The backend answers 413 JSON above 10 MB. Bodies over 11 MB stop here instead, so answer
  # them in the same contract `Error` shape rather than nginx's HTML page.
  client_max_body_size 11m;
  error_page 413 @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"error":"image is larger than 10 MB"}';
  }

  location /api/ {
    proxy_pass http://backend:3000;   # keeps the /api prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Server-Sent Events (#22): no buffering, long-lived connection.
  location /api/events {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Single-page app: unknown paths go to index.html
  location / {
    try_files $uri /index.html;
  }
}
